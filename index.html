<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Ben-Gurion</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            border: 2px solid #ccc;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #0038b8; /* Israeli blue */
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        #timer {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            font-family: monospace;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
        }

        #game-container:active {
            cursor: grabbing;
        }

        #game-board {
            width: 2500px;
            height: 1667px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/5/5b/Mahane_Yehuda_%28I%29_%2845298221191%29.jpg');
            background-size: cover;
            background-position: center;
            position: absolute;
            transform-origin: 0 0;
            /* Prevent image dragging */
            user-select: none;
            -webkit-user-drag: none;
        }

        .character {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s;
            /* Masking Strategy: Circular cutouts like a photo collage to cleanly fit rectangular photos */
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            border: 3px solid white;
            background-size: cover;
            background-position: top center;
            background-color: #eee;
        }

        .character:hover {
            filter: brightness(1.2);
        }

        /* Specific style for Ben Gurion to ensure the face is centered */
        .ben-gurion {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e8/David_Ben-Gurion_%28D597-087%29.jpg');
            background-position: center 20%;
        }

        #win-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #win-modal h2 {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 10px;
        }

        #win-modal p {
            font-size: 24px;
            color: white;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #0038b8;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background: #002888;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 1000;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="panel">
            <h1>Find Ben-Gurion!</h1>
            <p>He's hiding in Mahane Yehuda Market.</p>
        </div>
        <div class="panel">
            <div id="timer">00:00</div>
        </div>
    </div>

    <div class="instructions">
        Scroll to Zoom | Click & Drag to Pan
    </div>

    <div id="game-container">
        <div id="game-board">
            <div id="characters-container"></div>
        </div>
    </div>

    <div id="win-modal">
        <h2>Kol Hakavod!</h2>
        <p>You found Ben-Gurion in <span id="final-time"></span>!</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        // --- TIMER ---
        let startTime = Date.now();
        let timerInterval;
        let isFound = false;

        function updateTimer() {
            if (isFound) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }
        timerInterval = setInterval(updateTimer, 1000);

        // --- PAN & ZOOM MECHANICS ---
        const container = document.getElementById('game-container');
        const board = document.getElementById('game-board');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;

        // Center the board initially
        const centerBoard = () => {
            const containerRect = container.getBoundingClientRect();
            translateX = (containerRect.width - board.offsetWidth * scale) / 2;
            translateY = (containerRect.height - board.offsetHeight * scale) / 2;
            updateTransform();
        };

        function updateTransform() {
            board.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // Initialize position
        // Zoom out slightly to show more of the market
        scale = 0.6;
        centerBoard();

        // Panning
        container.addEventListener('mousedown', (e) => {
            if (e.target.closest('.character')) return; // Don't pan if clicking a character
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Zooming
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = 0.1;
            const oldScale = scale;
            if (e.deltaY < 0) {
                scale += zoomAmount; // Zoom in
            } else {
                scale -= zoomAmount; // Zoom out
            }
            scale = Math.max(0.4, Math.min(scale, 3)); // Clamp scale

            // Adjust translation to zoom towards cursor
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
            translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

            updateTransform();
        }, { passive: false });


        // --- CHARACTER GENERATION ---

        const containerDiv = document.getElementById('characters-container');

        // Spawn Zones Configuration for Mahane Yehuda
        // The image is 2500x1667.
        // The market path forms a rough triangle / trapezoid from the middle towards the bottom.
        // We'll define a walkable zone in the bottom 45% of the screen.
        const spawnZone = {
            minX: 200,
            maxX: 2300,
            minY: 900,  // Further back in the market
            maxY: 1600  // Closer to the camera
        };

        const characters = [];
        const numCharacters = 250; // Dense crowd

        // Generate characters with overlap prevention and depth scaling
        for (let i = 0; i < numCharacters; i++) {
            let validPosition = false;
            let x, y, scaleRatio;
            let attempts = 0;

            // Try to find a non-overlapping spot
            while (!validPosition && attempts < 150) {
                x = spawnZone.minX + Math.random() * (spawnZone.maxX - spawnZone.minX);
                y = spawnZone.minY + Math.random() * (spawnZone.maxY - spawnZone.minY);

                // For the market perspective, the aisle narrows towards the center.
                // Let's create a rough trapezoid boundary to keep people mostly in the central path
                // At minY (900), X should be between 900 and 1600.
                // At maxY (1600), X should be between 200 and 2300.
                const depthRatio = (y - spawnZone.minY) / (spawnZone.maxY - spawnZone.minY); // 0 to 1

                const leftBound = 900 - (700 * depthRatio);
                const rightBound = 1600 + (700 * depthRatio);

                if (x < leftBound || x > rightBound) {
                    attempts++;
                    continue; // Out of bounds of the market path
                }

                // Check distance to all other characters to prevent messy overlaps
                validPosition = true;
                for (const char of characters) {
                    const dx = char.x - x;
                    const dy = char.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Prevent them from being exactly on top of each other
                    if (dist < 40) {
                        validPosition = false;
                        break;
                    }
                }
                attempts++;
            }

            // Layering / Perspective:
            // Further up the screen (smaller Y) means smaller scale.
            // Y goes from 900 to 1600.
            const depth = (y - spawnZone.minY) / (spawnZone.maxY - spawnZone.minY); // 0 to 1
            scaleRatio = 0.3 + depth * 1.2; // Scales from 0.3 (far) to 1.5 (close)

            // Randomly select a portrait ID for Pravatar (1 to 70)
            const randomAvatarId = Math.floor(Math.random() * 70) + 1;

            characters.push({
                id: `char-${i}`,
                isTarget: i === 0, // 0 is Ben-Gurion
                avatarId: randomAvatarId,
                x: x,
                y: y,
                scale: scaleRatio,
                zIndex: Math.floor(y) // Higher Y (closer) = higher z-index
            });
        }

        // Sort characters by Y (z-index) so DOM paints them back-to-front
        characters.sort((a, b) => a.y - b.y);

        // Render characters
        characters.forEach(char => {
            const el = document.createElement('div');
            el.className = 'character';

            if (char.isTarget) {
                el.classList.add('ben-gurion');
            } else {
                // Using pravatar for generic diverse crowd faces
                el.style.backgroundImage = `url('https://i.pravatar.cc/100?img=${char.avatarId}')`;
            }

            // Base size for character cutouts is 80x80
            const size = 80;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;

            el.style.left = `${char.x - (size/2)}px`; // Center horizontally
            el.style.top = `${char.y - (size/2)}px`; // Center vertically

            el.style.transform = `scale(${char.scale})`;
            el.style.zIndex = char.zIndex;

            // Flip randomly for variety (only generic characters)
            if (!char.isTarget && Math.random() > 0.5) {
                el.style.transform = `scale(${char.scale}) scaleX(-1)`;
            }

            if (char.isTarget) {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isFound) return;
                    isFound = true;
                    clearInterval(timerInterval);
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const seconds = String(elapsed % 60).padStart(2, '0');
                    document.getElementById('final-time').textContent = `${minutes}:${seconds}`;
                    document.getElementById('win-modal').style.display = 'flex';
                });

            } else {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Clicked wrong person, maybe visual feedback?
                    el.style.border = "3px solid red";
                    setTimeout(() => {
                        el.style.border = "3px solid white";
                    }, 300);
                });
            }

            containerDiv.appendChild(el);
        });

    </script>
</body>
</html>
