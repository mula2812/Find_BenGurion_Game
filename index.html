body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-color: #000;
}

#ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;
    background-color: rgba(255, 255, 255, 0.9);
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    box-sizing: border-box;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

#ui-layer h1 {
    margin: 0;
    font-size: 20px;
    color: #333;
}

#level-indicator {
    font-size: 18px;
    font-weight: bold;
    color: #e53935;
}

#timer {
    font-size: 20px;
    font-weight: bold;
    color: #e53935;
}

#game-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    cursor: grab;
}

#game-container:active {
    cursor: grabbing;
}

#game-world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
}

.character {
    position: absolute;
    cursor: pointer;
    transition: transform 0.2s;
}

.character:hover {
    filter: brightness(1.2);
}

/* Modals */
#modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal {
    background-color: white;
    padding: 30px 50px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.modal h2 {
    margin-top: 0;
    color: #e53935;
    font-size: 28px;
}

.modal p {
    font-size: 18px;
    color: #333;
}

.modal button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #1e88e5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.modal button:hover {
    background-color: #1565c0;
}

.hidden {
    display: none !important;
}

</style>

let currentLevelIdx = 0;
let timeElapsed = 0;
let timerInterval;

// Elements
const gameContainer = document.getElementById("game-container");
const gameWorld = document.getElementById("game-world");
const currentLevelNameEl = document.getElementById("current-level-name");
const timerEl = document.getElementById("timer");

// Panning and Zooming State
let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let startX, startY;

function init() {
  setupControls();
  loadLevel(currentLevelIdx);
}

function startTimer() {
  clearInterval(timerInterval);
  timeElapsed = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeElapsed++;
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const minutes = Math.floor(timeElapsed / 60)
    .toString()
    .padStart(2, "0");
  const seconds = (timeElapsed % 60).toString().padStart(2, "0");
  timerEl.textContent = `${minutes}:${seconds}`;
}

function loadLevel(idx) {
  const level = levels[idx];
  currentLevelNameEl.textContent = level.name;

  // Reset World
  gameWorld.innerHTML = "";

  // Set Background
  const bgImg = document.createElement("img");
  bgImg.src = level.background;
  bgImg.style.width = "1600px";
  bgImg.style.height = "900px";
  bgImg.style.position = "absolute";
  bgImg.style.top = "0";
  bgImg.style.left = "0";
  bgImg.style.pointerEvents = "none";
  gameWorld.appendChild(bgImg);

  // Set Game World size based on bg
  gameWorld.style.width = "1600px";
  gameWorld.style.height = "900px";

  // Reset view
  scale = getFitScale();
  centerView();
  updateTransform();

  spawnCharacters(level);
  startTimer();
}

function getFitScale() {
  const containerRatio = gameContainer.clientWidth / gameContainer.clientHeight;
  const worldRatio = 1600 / 900;
  if (containerRatio > worldRatio) {
    return gameContainer.clientHeight / 900;
  } else {
    return gameContainer.clientWidth / 1600;
  }
}

function centerView() {
  translateX = (gameContainer.clientWidth - 1600 * scale) / 2;
  translateY = (gameContainer.clientHeight - 900 * scale) / 2;
}

// Ray-casting algorithm for point in polygon
function isPointInPolygon(point, vs) {
  let x = point[0],
    y = point[1];
  let inside = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    let xi = vs[i][0],
      yi = vs[i][1];
    let xj = vs[j][0],
      yj = vs[j][1];
    let intersect =
      yi > y != yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
    if (intersect) inside = !inside;
  }
  return inside;
}

// Generate random point within the bounding box, then check if in polygon
function getRandomPointInArea(area) {
  let minX = Infinity,
    maxX = -Infinity,
    minY = Infinity,
    maxY = -Infinity;
  area.forEach((p) => {
    if (p[0] < minX) minX = p[0];
    if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1];
    if (p[1] > maxY) maxY = p[1];
  });

  while (true) {
    const x = minX + Math.random() * (maxX - minX);
    const y = minY + Math.random() * (maxY - minY);
    if (isPointInPolygon([x, y], area)) {
      return { x, y, minY, maxY };
    }
  }
}

function checkOverlap(x, y, existingChars, minDistance) {
  for (let char of existingChars) {
    const dx = char.x - x;
    const dy = char.y - y;
    if (Math.sqrt(dx * dx + dy * dy) < minDistance) {
      return true;
    }
  }
  return false;
}

function spawnCharacters(level) {
  const existingPositions = [];

  // Spawn Target First to ensure he gets placed
  spawnSingleCharacter(TARGET_CHAR, level, existingPositions, true);

  // Spawn Crowd
  for (let i = 0; i < level.numCharacters; i++) {
    const charSrc = characters[Math.floor(Math.random() * characters.length)];
    spawnSingleCharacter(charSrc, level, existingPositions, false);
  }

  // Sort DOM elements by Y coordinate to handle overlap layering correctly
  const els = Array.from(gameWorld.getElementsByClassName("character"));
  els.sort((a, b) => parseFloat(a.style.top) - parseFloat(b.style.top));
  els.forEach((el) => gameWorld.appendChild(el)); // re-append in order
}

function spawnSingleCharacter(src, level, existingPositions, isTarget) {
  let pos;
  let attempts = 0;
  const maxAttempts = 100;

  // Character native size
  const charWidth = 100;
  const charHeight = 150;

  while (attempts < maxAttempts) {
    pos = getRandomPointInArea(level.walkableArea);

    // Calculate perspective scale based on Y position within the walkable area bounds
    // Y = minY -> minScale (furthest away)
    // Y = maxY -> baseScale (closest)
    const depthRatio = (pos.y - pos.minY) / (pos.maxY - pos.minY);
    const currentScale =
      level.minScale + depthRatio * (level.baseScale - level.minScale);

    // Adaptive overlap distance based on scale
    const overlapDistance = charWidth * currentScale * 0.6;

    if (!checkOverlap(pos.x, pos.y, existingPositions, overlapDistance)) {
      pos.scale = currentScale;
      existingPositions.push(pos);
      break;
    }
    attempts++;
  }

  if (attempts >= maxAttempts && !isTarget) {
    return; // Skip if we can't find a spot for a normal crowd member
  }

  const charEl = document.createElement("img");
  charEl.src = src;
  charEl.className = "character";
  charEl.style.left = `${pos.x}px`;
  charEl.style.top = `${pos.y}px`;

  // Apply scaling but keep transform-origin at bottom center (handled in CSS translate)
  // We append the scale to the translate to combine transforms
  charEl.style.transform = `translate(-50%, -100%) scale(${pos.scale})`;

  // Add specific width/height to avoid loading layout shifts
  charEl.style.width = `${charWidth}px`;
  charEl.style.height = `${charHeight}px`;

  if (isTarget) {
    charEl.onclick = handleWin;
    // Make it slightly harder by ensuring z-index isn't just randomly on top if overlapping
  } else {
    // Distraction click
    charEl.onclick = () => {
      charEl.style.filter = "brightness(0.5)";
      setTimeout(() => (charEl.style.filter = ""), 200);
    };
  }

  gameWorld.appendChild(charEl);
}

function handleWin() {
  clearInterval(timerInterval);

  const minutes = Math.floor(timeElapsed / 60)
    .toString()
    .padStart(2, "0");
  const seconds = (timeElapsed % 60).toString().padStart(2, "0");
  document.getElementById("final-time").textContent = `${minutes}:${seconds}`;

  document.getElementById("modal-overlay").classList.remove("hidden");

  if (currentLevelIdx < levels.length - 1) {
    document.getElementById("win-modal").classList.remove("hidden");
    document.getElementById("game-over-modal").classList.add("hidden");
  } else {
    document.getElementById("win-modal").classList.add("hidden");
    document.getElementById("game-over-modal").classList.remove("hidden");
  }
}

// Controls
function setupControls() {
  gameContainer.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
  });

  window.addEventListener("mouseup", () => {
    isDragging = false;
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateTransform();
  });

  gameContainer.addEventListener(
    "wheel",
    (e) => {
      e.preventDefault();

      const zoomIntensity = 0.1;
      const delta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;

      const newScale = Math.min(Math.max(0.5, scale + delta), 4);

      // Zoom relative to mouse position
      const rect = gameContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Calculate point in world coordinates
      const worldX = (mouseX - translateX) / scale;
      const worldY = (mouseY - translateY) / scale;

      scale = newScale;

      // Recalculate translate so the point under the mouse stays the same
      translateX = mouseX - worldX * scale;
      translateY = mouseY - worldY * scale;

      updateTransform();
    },
    { passive: false },
  );

  document.getElementById("next-level-btn").addEventListener("click", () => {
    document.getElementById("modal-overlay").classList.add("hidden");
    currentLevelIdx++;
    loadLevel(currentLevelIdx);
  });

  document.getElementById("restart-btn").addEventListener("click", () => {
    document.getElementById("modal-overlay").classList.add("hidden");
    currentLevelIdx = 0;
    loadLevel(currentLevelIdx);
  });
}

function updateTransform() {
  // Optional: clamp bounds so you can't pan too far outside the map
  // but leaving it freeform is also fine for now.
  gameWorld.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

// Start
init();

</script>
