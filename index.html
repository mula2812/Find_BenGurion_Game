<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Ben-Gurion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB; /* Sky blue */
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
        }

        #game-container:active {
            cursor: grabbing;
        }

        #game-board {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            /* Dimensions of the game board will be larger than the screen to allow panning */
            width: 2000px;
            height: 1500px;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #1E90FF 40%, #1E90FF 55%, #F4A460 55%, #F4A460 100%);
            /* 0-40%: Sky, 40-55%: Sea, 55-100%: Beach (Sand) */
        }

        /* SVG Background details can go here or directly in the JS */

        .character {
            position: absolute;
            transform-origin: bottom center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .character:hover {
            filter: brightness(1.1);
        }

        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: auto;
            border: 2px solid #333;
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        #instructions {
            font-size: 18px;
            color: #555;
        }

        #win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 4px solid #F4A460;
        }

        .modal-content h1 {
            margin-top: 0;
            color: #2E8B57; /* Sea green */
            font-size: 36px;
        }

        .modal-content p {
            font-size: 20px;
            color: #333;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            background-color: #1E90FF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0000CD;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="panel" id="instructions">
            Find <strong>Ben-Gurion</strong>! (Drag to pan)
        </div>
        <div class="panel" id="timer">
            Time: 00:00
        </div>
    </div>

    <div id="game-container">
        <div id="game-board">
            <!-- Background SVGs will be added via JS -->
            <svg id="bg-canvas" width="100%" height="100%" style="position: absolute; top: 0; left: 0; pointer-events: none;">
                <!-- Sun, clouds, boats, etc. -->
                <circle cx="1500" cy="200" r="80" fill="#FFD700" />
                <!-- Clouds -->
                <path d="M 200 150 Q 220 120 250 150 Q 280 130 300 150 Q 320 170 300 190 L 200 190 Q 180 170 200 150 Z" fill="white" opacity="0.8"/>
                <path d="M 800 250 Q 820 220 850 250 Q 880 230 900 250 Q 920 270 900 290 L 800 290 Q 780 270 800 250 Z" fill="white" opacity="0.8"/>
                <path d="M 1200 100 Q 1230 70 1270 100 Q 1310 80 1340 100 Q 1370 130 1340 160 L 1200 160 Q 1170 130 1200 100 Z" fill="white" opacity="0.8"/>

                <!-- Some boats on the sea (Y: 600 to 825) -->
                <g transform="translate(400, 700)">
                    <path d="M 0 0 L 20 20 L 80 20 L 100 0 Z" fill="white" />
                    <path d="M 50 20 L 50 -40 L 90 -10 Z" fill="#FF4500" />
                </g>
                <g transform="translate(1400, 750) scale(0.8)">
                    <path d="M 0 0 L 20 20 L 80 20 L 100 0 Z" fill="white" />
                    <path d="M 50 20 L 50 -40 L 90 -10 Z" fill="#1E90FF" />
                </g>

                <!-- Beach Umbrellas to add flavor -->
                <g transform="translate(300, 900)">
                    <rect x="-2" y="0" width="4" height="60" fill="#8B4513" />
                    <path d="M -40 0 Q 0 -30 40 0 Z" fill="#FF6347" />
                </g>
                <g transform="translate(800, 1000) scale(1.2)">
                    <rect x="-2" y="0" width="4" height="60" fill="#8B4513" />
                    <path d="M -40 0 Q 0 -30 40 0 Z" fill="#32CD32" />
                </g>
                <g transform="translate(1600, 1100) scale(1.5)">
                    <rect x="-2" y="0" width="4" height="60" fill="#8B4513" />
                    <path d="M -40 0 Q 0 -30 40 0 Z" fill="#FFD700" />
                </g>
                <g transform="translate(1200, 1300) scale(1.8)">
                    <rect x="-2" y="0" width="4" height="60" fill="#8B4513" />
                    <path d="M -40 0 Q 0 -30 40 0 Z" fill="#FF69B4" />
                </g>
            </svg>
            <div id="characters-container"></div>
        </div>
    </div>

    <div id="win-modal">
        <div class="modal-content">
            <h1>You Found Ben-Gurion!</h1>
            <p>Time: <span id="final-time"></span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let startTime = Date.now();
        let timerInterval;
        let isFound = false;

        // Timer Logic
        const timerElement = document.getElementById('timer');
        function updateTimer() {
            if (isFound) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            timerElement.textContent = `Time: ${minutes}:${seconds}`;
        }
        timerInterval = setInterval(updateTimer, 1000);

        // --- PANNING AND ZOOMING LOGIC ---
        const container = document.getElementById('game-container');
        const board = document.getElementById('game-board');

        let isDragging = false;
        let startX, startY;
        let translateX = 0;
        let translateY = 0;
        let scale = 1;

        // Initialize board position to center slightly
        const boardWidth = 2000;
        const boardHeight = 1500;

        function updateTransform() {
            // Constrain translation to keep the board on screen
            const minX = container.clientWidth - boardWidth * scale;
            const minY = container.clientHeight - boardHeight * scale;

            if (translateX > 0) translateX = 0;
            if (translateY > 0) translateY = 0;
            if (translateX < minX) translateX = minX;
            if (translateY < minY) translateY = minY;

            // If board is smaller than screen (due to scale), center it
            if (boardWidth * scale < container.clientWidth) {
                translateX = (container.clientWidth - boardWidth * scale) / 2;
            }
            if (boardHeight * scale < container.clientHeight) {
                translateY = (container.clientHeight - boardHeight * scale) / 2;
            }

            board.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // Center initially
        translateX = (container.clientWidth - boardWidth) / 2;
        translateY = (container.clientHeight - boardHeight) / 2;
        updateTransform();

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        // Optional Zooming
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = 0.1;
            const oldScale = scale;
            if (e.deltaY < 0) {
                scale += zoomAmount; // Zoom in
            } else {
                scale -= zoomAmount; // Zoom out
            }
            scale = Math.max(0.5, Math.min(scale, 3)); // Clamp scale

            // Adjust translation to zoom towards cursor
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
            translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

            updateTransform();
        });

        // --- CHARACTER GENERATION ---

        // SVG templates for different character types
        const svgs = {
            tourist1: `<svg viewBox="0 0 100 150" width="50" height="75"><circle cx="50" cy="30" r="20" fill="#FFCDB2"/><rect x="35" y="50" width="30" height="40" fill="#FFB4A2"/><path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#6D6875"/><path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#6D6875"/><rect x="25" y="55" width="10" height="30" fill="#FFCDB2"/><rect x="65" y="55" width="10" height="30" fill="#FFCDB2"/><path d="M 30 10 Q 50 -10 70 10 Z" fill="#E5989B"/><rect x="40" y="60" width="20" height="15" fill="#333"/></svg>`,
            tourist2: `<svg viewBox="0 0 100 150" width="50" height="75"><circle cx="50" cy="30" r="20" fill="#F8AD9D"/><rect x="35" y="50" width="30" height="40" fill="#B5838D"/><path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#E5989B"/><path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#E5989B"/><rect x="25" y="55" width="10" height="30" fill="#F8AD9D"/><rect x="65" y="55" width="10" height="30" fill="#F8AD9D"/><circle cx="50" cy="15" r="15" fill="#FFB4A2"/></svg>`,
            soldier: `<svg viewBox="0 0 100 150" width="50" height="75"><circle cx="50" cy="30" r="20" fill="#FFCDB2"/><rect x="35" y="50" width="30" height="40" fill="#556B2F"/><path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#556B2F"/><path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#556B2F"/><rect x="25" y="55" width="10" height="30" fill="#556B2F"/><rect x="65" y="55" width="10" height="30" fill="#556B2F"/><path d="M 30 15 Q 50 0 70 15 L 65 25 L 35 25 Z" fill="#556B2F"/><rect x="70" y="60" width="5" height="40" fill="#333"/></svg>`,
            beachgoer1: `<svg viewBox="0 0 100 150" width="50" height="75"><circle cx="50" cy="30" r="20" fill="#E0AC69"/><rect x="35" y="50" width="30" height="40" fill="#FF4500"/><path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#E0AC69"/><path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#E0AC69"/><rect x="25" y="55" width="10" height="30" fill="#E0AC69"/><rect x="65" y="55" width="10" height="30" fill="#E0AC69"/><circle cx="50" cy="28" r="15" fill="none" stroke="black" stroke-width="2"/><line x1="35" y1="28" x2="65" y2="28" stroke="black" stroke-width="2"/></svg>`,
            beachgoer2: `<svg viewBox="0 0 100 150" width="50" height="75"><circle cx="50" cy="30" r="20" fill="#8D5524"/><rect x="35" y="50" width="30" height="20" fill="#00CED1"/><path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#8D5524"/><path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#8D5524"/><rect x="25" y="55" width="10" height="30" fill="#8D5524"/><rect x="65" y="55" width="10" height="30" fill="#8D5524"/><path d="M 35 70 L 65 70 L 65 90 L 35 90 Z" fill="#FF1493"/></svg>`,
            kid: `<svg viewBox="0 0 80 120" width="40" height="60"><circle cx="40" cy="24" r="16" fill="#FFDCB3"/><rect x="28" y="40" width="24" height="32" fill="#FFD700"/><path d="M 28 72 L 28 112 L 36 112 L 36 72 Z" fill="#1E90FF"/><path d="M 44 72 L 44 112 L 52 112 L 52 72 Z" fill="#1E90FF"/><rect x="20" y="44" width="8" height="24" fill="#FFDCB3"/><rect x="52" y="44" width="8" height="24" fill="#FFDCB3"/><circle cx="40" cy="12" r="12" fill="#8B4513"/></svg>`,
            ben_gurion: `<svg viewBox="0 0 100 150" width="50" height="75">
                <!-- Ben-Gurion -->
                <!-- Head -->
                <circle cx="50" cy="30" r="20" fill="#FFCDB2"/>
                <!-- Iconic white tufts of hair -->
                <path d="M 25 30 Q 15 15 35 10 Q 30 20 28 30 Z" fill="white"/>
                <path d="M 75 30 Q 85 15 65 10 Q 70 20 72 30 Z" fill="white"/>
                <!-- Khaki Suit -->
                <rect x="35" y="50" width="30" height="40" fill="#C3B091"/>
                <path d="M 35 90 L 35 140 L 45 140 L 45 90 Z" fill="#C3B091"/>
                <path d="M 55 90 L 55 140 L 65 140 L 65 90 Z" fill="#C3B091"/>
                <rect x="25" y="55" width="10" height="30" fill="#C3B091"/>
                <rect x="65" y="55" width="10" height="30" fill="#C3B091"/>
                <!-- Tie / Collar detail -->
                <path d="M 45 50 L 55 50 L 50 60 Z" fill="white"/>
                <path d="M 48 60 L 52 60 L 50 75 Z" fill="#333"/>
            </svg>`
        };

        const charKeys = Object.keys(svgs).filter(k => k !== 'ben_gurion');

        const containerDiv = document.getElementById('characters-container');

        // Spawn Zones Configuration
        // The scene is a beach. Background gradient: 0-40% Sky, 40-55% Sea, 55-100% Sand.
        // Therefore, walkable area (sand) is from Y = 825px to 1500px.
        const spawnZone = {
            minX: 50,
            maxX: 1950,
            minY: 850, // Start of the sand
            maxY: 1450 // Bottom of the board
        };

        const characters = [];
        const numCharacters = 400; // Dense crowd

        // Generate characters with overlap prevention and depth scaling
        for (let i = 0; i < numCharacters; i++) {
            let validPosition = false;
            let x, y, scaleRatio;
            let attempts = 0;

            // Try to find a non-overlapping spot
            while (!validPosition && attempts < 100) {
                x = spawnZone.minX + Math.random() * (spawnZone.maxX - spawnZone.minX);
                y = spawnZone.minY + Math.random() * (spawnZone.maxY - spawnZone.minY);

                // Check distance to all other characters to prevent messy overlaps
                validPosition = true;
                for (const char of characters) {
                    const dx = char.x - x;
                    const dy = char.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Allow some overlap, especially vertical (y), but prevent them from being exactly on top of each other
                    if (dist < 25) {
                        validPosition = false;
                        break;
                    }
                }
                attempts++;
            }

            // Layering / Perspective:
            // Further up the screen (smaller Y) means smaller scale.
            // Y goes from 850 to 1450.
            const depth = (y - spawnZone.minY) / (spawnZone.maxY - spawnZone.minY); // 0 to 1
            scaleRatio = 0.5 + depth * 0.8; // Scales from 0.5 to 1.3

            characters.push({
                id: `char-${i}`,
                type: i === 0 ? 'ben_gurion' : charKeys[Math.floor(Math.random() * charKeys.length)],
                x: x,
                y: y,
                scale: scaleRatio,
                zIndex: Math.floor(y) // Higher Y (closer) = higher z-index
            });
        }

        // We want Ben-Gurion to be hidden well, maybe randomize his position in the array
        // actually he is char-0, let's make sure his position isn't always the first generated spot?
        // It's random anyway.

        // Sort characters by Y (z-index) so DOM paints them back-to-front
        characters.sort((a, b) => a.y - b.y);

        // Render characters
        characters.forEach(char => {
            const el = document.createElement('div');
            el.className = 'character';
            el.innerHTML = svgs[char.type];
            el.style.left = `${char.x - 25}px`; // Center horizontally (width 50)
            el.style.top = `${char.y - 75}px`; // Align bottom (height 75)
            el.style.transform = `scale(${char.scale})`;
            el.style.zIndex = char.zIndex;

            // Flip randomly for variety
            if (Math.random() > 0.5) {
                const svgEl = el.querySelector('svg');
                svgEl.style.transform = 'scaleX(-1)';
            }

            if (char.type === 'ben_gurion') {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isFound) return;
                    isFound = true;
                    clearInterval(timerInterval);
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const seconds = String(elapsed % 60).padStart(2, '0');
                    document.getElementById('final-time').textContent = `${minutes}:${seconds}`;
                    document.getElementById('win-modal').style.display = 'flex';
                });

                // For debug purposes, to quickly find him during testing
                // el.style.border = "1px solid red";
            } else {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Clicked wrong person, maybe visual feedback?
                    el.style.transform = `scale(${char.scale}) rotate(10deg)`;
                    setTimeout(() => {
                        el.style.transform = `scale(${char.scale}) rotate(0deg)`;
                    }, 200);
                });
            }

            containerDiv.appendChild(el);
        });

    </script>
</body>
</html>
